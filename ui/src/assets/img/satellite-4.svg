    <circle cx="40" cy="100" r="14"/><circle cx="70" cy="115" r="11"/><circle cx="110" cy="95" r="13"/>
    <circle cx="180" cy="120" r="15"/><circle cx="230" cy="105" r="12"/><circle cx="300" cy="95" r="14"/>
    <circle cx="345" cy="115" r="11"/><circle cx="60" cy="175" r="13"/><circle cx="150" cy="185" r="14"/>
    <circle cx="260" cy="175" r="13"/><circle cx="330" cy="185" r="12"/>
