    <circle cx="90" cy="230" r="14"/><circle cx="200" cy="245" r="15"/><circle cx="310" cy="235" r="13"/>
  </g>
  <!-- mountain stream -->
  <path d="M210,-5 C 200,60 250,120 220,180 C 195,230 235,270 220,305" fill="none" stroke="#7ea6b8" stroke-width="5" opacity="0.75" stroke-linecap="round"/>
