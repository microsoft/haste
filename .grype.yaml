# Grype matches by version, so it still reports zlib 1.3.2 even though the
# runtime build applies the upstream fix (native/gdal-runtime/patches). Remove
# this entry when sources.lock moves to a zlib release that contains the fix.
# Checked 2026-10-21: the latest zlib release is 1.3.2 and does not include
# the fix (madler/zlib df84af25), so the patched build remains in use.
ignore:
  - vulnerability: CVE-2026-85091
    package:
      name: zlib
