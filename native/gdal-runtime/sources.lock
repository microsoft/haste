# Native sources for the HASTE GDAL runtime.
#
# One component per line: name version url sha256
# Every hash comes from the upstream release itself:
# - GitHub-computed asset digests for GDAL, PROJ, libjpeg-turbo, zlib,
#   OpenSSL, curl and libdeflate;
# - the .sha256 file zstd publishes;
# - for SQLite, the published SHA3-256, checked locally and recorded here as
#   SHA-256.
# fetch_sources.py refuses any file that doesn't match.
#
# Bump the runtime build number (HASTE_GDAL_BUILD) with any change here.

