name: Build hastegeo wheel

on:
  pull_request:
    branches:
      - main
    paths:
      - "hastelib/**"
      - ".github/scripts/resolve_hastegeo_version.py"
      - ".github/scripts/publish_hastegeo_wheel.py"
      - ".github/workflows/hastegeo-build.yml"
  push:
    branches:
      - main
    paths:
      - "hastelib/**"
  workflow_dispatch:
    inputs:
      channel:
        description: "Build channel"
        required: true
        default: "rc"
        type: choice
        options:
          - rc
          - release
      bump:
        description: "Version bump when set_version is blank"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major
      set_version:
        description: "Optional exact X.Y.Z or (for RC) X.Y.ZrcN"
        required: false
        default: ""
        type: string

# This workflow is intentionally credential-free. The trusted
# workflow_run publisher lives in hastegeo-publish.yml on the default branch.
permissions:
  contents: read

jobs:
  build-wheel:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout source without persisted credentials
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Resolve version
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          CHANNEL: ${{ github.event.inputs.channel || (github.event_name == 'pull_request' && 'rc' || 'release') }}
          BUMP: ${{ github.event.inputs.bump || 'patch' }}
          SET_VERSION: ${{ github.event.inputs.set_version || '' }}
        run: |
          python .github/scripts/resolve_hastegeo_version.py \
            --channel "$CHANNEL" \
            --source-sha "$SOURCE_SHA" \
            --bump "$BUMP" \
            --set-version "$SET_VERSION" \
            --json-output release-resolution.json

      - name: Install pinned build frontend
        run: python -m pip install "build==1.3.0"

      - name: Run release-policy unit tests
        run: python -m unittest discover -s hastelib/tests/build -v

      - name: Build wheel
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path

          resolution = json.loads(
              Path("release-resolution.json").read_text(encoding="utf-8")
          )
          if resolution["already_published"]:
              print("Wheel already published; skipping build")
              raise SystemExit(0)

          env = os.environ.copy()
          env["HASTE_SET_VERSION"] = resolution["version"]
          subprocess.run(
              [sys.executable, "-m", "build", "--wheel"],
              cwd="hastelib",
              env=env,
              check=True,
          )
          PY

      - name: Validate wheel without GitHub credentials
        run: |
          python - <<'PY'
          import json
          import subprocess
          import sys
          from pathlib import Path

          resolution = json.loads(
              Path("release-resolution.json").read_text(encoding="utf-8")
          )
          if resolution["already_published"]:
              print("Wheel already published; skipping validation")
              raise SystemExit(0)

          subprocess.run(
              [
                  sys.executable,
                  ".github/scripts/publish_hastegeo_wheel.py",
                  "--wheel",
                  str(Path("hastelib/dist") / resolution["wheel_name"]),
                  "--expected-version",
                  resolution["version"],
                  "--channel",
                  resolution["channel"],
                  "--source-sha",
                  resolution["source_sha"],
                  "--validate-only",
              ],
              check=True,
          )
          PY

      - name: Upload validated wheel artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hastegeo-wheel-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 7
          path: hastelib/dist/*.whl
