name: Build hastegeo wheel

on:
  pull_request:
    branches:
      - main
    paths:
      - "hastelib/**"
      - ".github/scripts/resolve_hastegeo_version.py"
      - ".github/scripts/publish_hastegeo_wheel.py"
      - ".github/workflows/hastegeo-build.yml"
  push:
    branches:
      - main
    paths:
      - "hastelib/**"
  workflow_dispatch:
    inputs:
      channel:
        description: "Manual runs only: dev publishes the wheel, rc/release build without publishing. PRs always publish an rc."
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - rc
          - release
      bump:
        description: "Bumps the latest stable version: patch by default, or minor/major. Ignored when an exact version is given."
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major
      set_version:
        description: "Optional exact version: X.Y.Z on any channel, or X.Y.ZrcN / X.Y.Z.devN to pin the rc/dev number."
        required: false
        default: ""
        type: string

# This workflow is intentionally credential-free. The trusted
# workflow_run publisher lives in hastegeo-publish.yml on the default branch.
permissions:
  contents: read

jobs:
  resolve-version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      wheel_name: ${{ steps.resolve.outputs.wheel_name }}
      channel: ${{ steps.resolve.outputs.channel }}
      source_sha: ${{ steps.resolve.outputs.source_sha }}
      already_published: ${{ steps.resolve.outputs.already_published }}
    steps:
      - name: Checkout source without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      # hastegeo-publish.yml re-resolves the version from trusted policy on the
      # default branch, and calls the resolver with only --channel and
      # --source-sha -- it cannot read a dispatch's inputs, by design, since
      # they originate on the built ref. A dev dispatch that bumps or pins a
      # version therefore builds one wheel while the publisher expects the
      # default patch version, and the artifact-name check fails after the
      # build. Refuse up front instead of wasting the build on a run that
      # cannot publish.
      - name: Reject version overrides on a publishable dev dispatch
        if: >-
          github.event_name == 'workflow_dispatch' &&
          github.event.inputs.channel == 'dev' &&
          (github.event.inputs.bump != 'patch' ||
           github.event.inputs.set_version != '')
        env:
          BUMP: ${{ github.event.inputs.bump }}
          SET_VERSION: ${{ github.event.inputs.set_version }}
        run: |
          echo "::error::A dev dispatch must use the default 'patch' bump and" \
               "an empty set_version (got bump='${BUMP}'," \
               "set_version='${SET_VERSION}'). The trusted publisher" \
               "re-resolves the version with defaults and cannot see these" \
               "inputs, so any other value builds a wheel it will refuse." \
               "Use bump/set_version only with channel rc or release, which" \
               "are build-and-validate only."
          exit 1

      - name: Resolve version
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          CHANNEL: ${{ github.event.inputs.channel || (github.event_name == 'pull_request' && 'rc' || 'release') }}
          BUMP: ${{ github.event.inputs.bump || 'patch' }}
          SET_VERSION: ${{ github.event.inputs.set_version || '' }}
        run: |
          python .github/scripts/resolve_hastegeo_version.py \
            --channel "$CHANNEL" \
            --source-sha "$SOURCE_SHA" \
            --bump "$BUMP" \
            --set-version "$SET_VERSION"

  build-wheel:
    needs: resolve-version
    if: needs.resolve-version.outputs.already_published != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout source without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve-version.outputs.source_sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install pinned build frontend
        run: python -m pip install "build==1.3.0"

      - name: Run release-policy unit tests
        run: python -m unittest discover -s hastelib/tests/build -v

      - name: Build wheel
        working-directory: hastelib
        env:
          HASTE_SET_VERSION: ${{ needs.resolve-version.outputs.version }}
        run: python -m build --wheel

      - name: Validate wheel without GitHub credentials
        run: |
          python .github/scripts/publish_hastegeo_wheel.py \
            --wheel "hastelib/dist/${{ needs.resolve-version.outputs.wheel_name }}" \
            --expected-version "${{ needs.resolve-version.outputs.version }}" \
            --channel "${{ needs.resolve-version.outputs.channel }}" \
            --source-sha "${{ needs.resolve-version.outputs.source_sha }}" \
            --validate-only

      - name: Upload validated wheel artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hastegeo-wheel-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 7
          path: hastelib/dist/${{ needs.resolve-version.outputs.wheel_name }}
