name: Deploy Azure Applications

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment (must match a configured GitHub Environment)"
        required: true
        type: string
      component:
        # A choice option is the literal value passed to deploy_apps.sh, not a
        # display label, so these must stay bare names. Describe them here.
        description: "Which component to deploy. funcapi = API backend, funcqueue = job processor, titiler = tile server, swa = UI."
        required: true
        default: "all"
        type: choice
        options:
          - all
          - funcapi
          - funcqueue
          - titiler
          - swa
      training_image_tag:
        description: "Training image tag, for training/inference jobs. Blank = keep the image this environment already runs."
        required: false
        default: ""
        type: string
      imageprep_image_tag:
        description: "Imageryprep image tag, for imagery preparation jobs. Blank = keep the image this environment already runs. Need not match the training tag except for an RC."
        required: false
        default: ""
        type: string
      app_tag:
        description: "Application version; recorded as a tag on the Azure resources."
        required: true
        type: string
      hastegeo_version:
        description: "hastegeo wheel version, used by funcapi and funcqueue. Blank = latest available stable release"
        required: false
        default: ""
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      id-token: write
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - name: Install tools
        run: |
          curl https://packages.microsoft.com/keys/microsoft.asc | gpg --dearmor > microsoft.gpg
          sudo mv microsoft.gpg /etc/apt/trusted.gpg.d/microsoft.gpg
          sudo sh -c 'echo "deb [arch=amd64] https://packages.microsoft.com/repos/microsoft-ubuntu-$(lsb_release -cs)-prod $(lsb_release -cs) main" > /etc/apt/sources.list.d/dotnetdev.list'
          sudo apt-get update
          sudo apt-get install git-lfs -y
          git lfs env
          sudo apt-get install azure-functions-core-tools-4 jq git-lfs -y
          npm install -g @azure/static-web-apps-cli@2.0.9

      - name: Resolve hastegeo wheel URL
        id: hastegeo
        if: >-
          inputs.component == 'all' ||
          inputs.component == 'funcapi' ||
          inputs.component == 'funcqueue'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python .github/scripts/resolve_hastegeo_deploy.py \
            --version "${{ inputs.hastegeo_version }}"

      - name: Azure Login
        uses: azure/login@1384c340ab2dda50fed2bee3041d1d87018aa5e8 # v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Runs after Azure Login because a blank tag inherits what the target
      # environment is already running. Deploying a branch that changes neither
      # hastelib/ nor docker/ builds no images at all, and there is no stable
      # image build on merge to fall back on, so the old default -- the
      # resolved hastegeo version -- named a tag that usually does not exist.
      # Inheriting means a contributor with no image changes leaves both
      # fields empty and nothing about Batch moves.
      - name: Resolve matching image tags
        id: artifacts
        env:
          VERSION: ${{ steps.hastegeo.outputs.version }}
          TRAINING_INPUT: ${{ inputs.training_image_tag }}
          IMAGEPREP_INPUT: ${{ inputs.imageprep_image_tag }}
          # Only these components write the Batch image settings; titiler and
          # swa pass `false` for that block in deploy_apps.sh.
          NEEDS_IMAGES: ${{ inputs.component == 'all' || inputs.component == 'funcapi' || inputs.component == 'funcqueue' }}
          COMPONENT: ${{ inputs.component }}
          RESOURCE_GROUP: ${{ secrets.RESOURCE_PREFIX }}-haste-${{ secrets.RESOURCE_SUFFIX }}-rg
          API_APP: ${{ secrets.RESOURCE_PREFIX }}haste${{ secrets.RESOURCE_SUFFIX }}func
          QUEUE_APP: ${{ secrets.RESOURCE_PREFIX }}hastequeue${{ secrets.RESOURCE_SUFFIX }}func
        run: |
          TRAINING_TAG="$TRAINING_INPUT"
          IMAGEPREP_TAG="$IMAGEPREP_INPUT"

          # An RC publishes wheel and images together at one locked version, so
          # a blank input means that version and a mismatch is refused.
          if [[ "$VERSION" == *rc* ]]; then
            TRAINING_TAG="${TRAINING_TAG:-$VERSION}"
            IMAGEPREP_TAG="${IMAGEPREP_TAG:-$VERSION}"
            if [[ "$TRAINING_TAG" != "$VERSION" || \
                  "$IMAGEPREP_TAG" != "$VERSION" ]]; then
              echo "::error::RC deployments require matching wheel and image tags"
              exit 1
            fi
          fi

          if [[ "$NEEDS_IMAGES" == "true" && \
                ( -z "$TRAINING_TAG" || -z "$IMAGEPREP_TAG" ) ]]; then
            # Read from the app actually being deployed, so "keep the running
            # image" is literally true. funcapi and funcqueue each carry their
            # own copy of these settings (deploy_apps.sh passes true for the
            # settings block on both), and deploying them separately lets the
            # two drift; reading the wrong one would silently move an app onto
            # the other's image. `all` writes both, so either source unifies
            # them -- use the queue app, which is the one submitting Batch jobs.
            if [[ "$COMPONENT" == "funcapi" ]]; then
              SOURCE_APP="$API_APP"
            else
              SOURCE_APP="$QUEUE_APP"
            fi
            echo "Reading current images from ${SOURCE_APP}..."
            # Settings hold a full ref, <acr>.azurecr.io/hastetraining:<tag>.
            # Keep only what follows the final colon, and treat a ref with no
            # colon as absent rather than mistaking the repository for a tag.
            read_tag() {
              local ref
              ref=$(az functionapp config appsettings list \
                --name "$SOURCE_APP" \
                --resource-group "$RESOURCE_GROUP" \
                --query "[?name=='$1'].value | [0]" \
                -o tsv 2>/dev/null) || ref=""
              [[ "$ref" == *:* ]] && printf '%s' "${ref##*:}"
            }
            TRAINING_TAG="${TRAINING_TAG:-$(read_tag AZURE_BATCH_DOCKER_IMAGE)}"
            IMAGEPREP_TAG="${IMAGEPREP_TAG:-$(read_tag AZURE_BATCH_IMAGERYPREP_DOCKER_IMAGE)}"
          fi

          if [[ "$NEEDS_IMAGES" == "true" && \
                ( -z "$TRAINING_TAG" || -z "$IMAGEPREP_TAG" ) ]]; then
            echo "::error::No image tag given and none to inherit --" \
                 "${SOURCE_APP:-the target app} has no AZURE_BATCH_DOCKER_IMAGE" \
                 "yet, so this looks like a first deploy to this environment." \
                 "Pass training_image_tag and imageprep_image_tag explicitly."
            exit 1
          fi

          echo "Training image tag:   ${TRAINING_TAG:-<unused for this component>}"
          echo "Imageryprep image tag: ${IMAGEPREP_TAG:-<unused for this component>}"
          echo "training_tag=$TRAINING_TAG" >> "$GITHUB_OUTPUT"
          echo "imageprep_tag=$IMAGEPREP_TAG" >> "$GITHUB_OUTPUT"

      - name: Git LFS Pull
        run: git lfs pull
      - name: Deploy
        env:
          # Non-sensitive UI feature flag, baked into the Vite bundle at build time.
          # Set as a GitHub Environment variable; defaults to false when unset.
          VITE_SHOW_FOOTER: ${{ vars.VITE_SHOW_FOOTER }}
          # Data-publishing config, mirroring the publishing/PC params on the
          # Bicep path. Non-sensitive flags/prefix are Environment variables;
          # the organization attribution, URLs, ingestion source, license, and
          # publish-storage target are Environment *secrets* (masked in logs).
          # Each defaults to off/unset in deploy_apps.sh when absent.
          PUBLISHING_ENABLED: ${{ vars.PUBLISHING_ENABLED }}
          PC_PROVIDER_ENABLED: ${{ vars.PC_PROVIDER_ENABLED }}
          PUBLISH_EXPLORER_RENDER_ENABLED: ${{ vars.PUBLISH_EXPLORER_RENDER_ENABLED }}
          PC_COLLECTION_PREFIX: ${{ vars.PC_COLLECTION_PREFIX }}
          PUBLISHING_ORGANIZATION_NAME: ${{ secrets.PUBLISHING_ORGANIZATION_NAME }}
          PUBLISHING_ORGANIZATION_URL: ${{ secrets.PUBLISHING_ORGANIZATION_URL }}
          PC_GEOCATALOG_URL: ${{ secrets.PC_GEOCATALOG_URL }}
          PC_EXPLORER_URL: ${{ secrets.PC_EXPLORER_URL }}
          PC_INGESTION_SOURCE: ${{ secrets.PC_INGESTION_SOURCE }}
          PC_PUBLISHING_LICENSE: ${{ secrets.PC_PUBLISHING_LICENSE }}
          PUBLISH_STORAGE_ACCOUNT_URL: ${{ secrets.PUBLISH_STORAGE_ACCOUNT_URL }}
          PUBLISH_BLOB_CONTAINER: ${{ secrets.PUBLISH_BLOB_CONTAINER }}
          # hastegeo wheel pinned into the function-app requirements before
          # `func publish` (deploy_apps.sh); the editable default can't resolve
          # on Azure's remote build.
          HASTEGEO_WHEEL_URL: ${{ steps.hastegeo.outputs.url }}
          # Recorded as a `hastegeo_version` tag on each app that installs the
          # wheel, so there is a durable record of what is deployed. Nothing
          # reads it back yet -- a blank hastegeo_version still resolves to
          # latest stable.
          HASTEGEO_VERSION: ${{ steps.hastegeo.outputs.version }}
          # Batch pool wiring. All optional: unset reproduces the legacy
          # single-pool behavior. Stored as environment *secrets* (not
          # variables) so the values are masked in this repo's public
          # Actions logs, matching the other infra-naming config.
          BATCH_TRAINING_POOL_ID: ${{ secrets.BATCH_TRAINING_POOL_ID }}
          BATCH_IMAGERYPREP_POOL_ID: ${{ secrets.BATCH_IMAGERYPREP_POOL_ID }}
          BATCH_TRAINING_POOL_IDS: ${{ secrets.BATCH_TRAINING_POOL_IDS }}
          BATCH_INFERENCE_POOL_IDS: ${{ secrets.BATCH_INFERENCE_POOL_IDS }}
          BATCH_IMAGERYPREP_POOL_IDS: ${{ secrets.BATCH_IMAGERYPREP_POOL_IDS }}
          BATCH_USE_SAS: ${{ secrets.BATCH_USE_SAS }}
          BATCH_MANAGE_POOLS: ${{ secrets.BATCH_MANAGE_POOLS }}
        run: |
          chmod +x .github/scripts/deploy_apps.sh
          .github/scripts/deploy_apps.sh \
            "${{ secrets.AZURE_TENANT_ID }}" \
            "${{ secrets.AZURE_SUBSCRIPTION_ID }}" \
            "${{ secrets.RESOURCE_PREFIX }}" \
            "${{ secrets.LOCATION }}" \
            "${{ secrets.RESOURCE_SUFFIX }}" \
            "${{ secrets.ACR_NAME }}" \
            "${{ steps.artifacts.outputs.training_tag }}" \
            "${{ steps.artifacts.outputs.imageprep_tag }}" \
            "${{ secrets.ENVIRONMENT_TYPE }}" \
            "${{ inputs.app_tag }}" \
            "${{ secrets.BATCH_ACCOUNT }}" \
            "${{ secrets.SHARED_RESOURCE_GROUP }}" \
            "${{ secrets.STATIC_APP_DOMAIN }}" \
            "${{ secrets.EMAIL_CONNECTION_STRING }}" \
            "${{ inputs.component }}"