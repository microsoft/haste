name: Deploy Azure Applications

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment (must match a configured GitHub Environment)"
        required: true
        type: string
      training_image_tag:
        description: "Training Docker image tag"
        required: true
        type: string
      imageprep_image_tag:
        description: "Image prep Docker image tag"
        required: true
        type: string
      app_tag:
        description: "Application version tag"
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      id-token: write
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
      - name: Install tools
        run: |
          curl https://packages.microsoft.com/keys/microsoft.asc | gpg --dearmor > microsoft.gpg
          sudo mv microsoft.gpg /etc/apt/trusted.gpg.d/microsoft.gpg
          sudo sh -c 'echo "deb [arch=amd64] https://packages.microsoft.com/repos/microsoft-ubuntu-$(lsb_release -cs)-prod $(lsb_release -cs) main" > /etc/apt/sources.list.d/dotnetdev.list'
          sudo apt-get update
          sudo apt-get install git-lfs -y
          git lfs env
          sudo apt-get install azure-functions-core-tools-4 jq git-lfs -y
          npm install -g @azure/static-web-apps-cli

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Git LFS Pull
        run: git lfs pull
      - name: Deploy
        run: |
          chmod +x .github/scripts/deploy_apps.sh
          .github/scripts/deploy_apps.sh \
            "${{ secrets.AZURE_TENANT_ID }}" \
            "${{ secrets.AZURE_SUBSCRIPTION_ID }}" \
            "${{ secrets.RESOURCE_PREFIX }}" \
            "${{ secrets.LOCATION }}" \
            "${{ secrets.RESOURCE_SUFFIX }}" \
            "${{ secrets.ACR_NAME }}" \
            "${{ inputs.training_image_tag }}" \
            "${{ inputs.imageprep_image_tag }}" \
            "${{ inputs.environment }}" \
            "${{ inputs.app_tag }}" \
            "${{ secrets.BATCH_ACCOUNT }}" \
            "${{ secrets.SHARED_RESOURCE_GROUP }}" \
            "${{ secrets.STATIC_APP_DOMAIN }}" \
            "${{ secrets.EMAIL_CONNECTION_STRING }}"