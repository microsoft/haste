name: Publish product release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing v* tag to publish notes for"
        required: true
        type: string

# Product releases only. hastegeo wheels are published by
# hastegeo-publish.yml into the haste-binaries asset store and never
# get a release of their own.
permissions:
  contents: read

# Scoped per tag, never shared. GitHub keeps only one *pending* run per
# concurrency group, so a single shared group makes each new dispatch cancel
# the one queued behind it -- a backfill would silently lose releases.
# Cross-run ordering is handled by reconciling the badge instead (below).
concurrency:
  group: product-release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Resolve tag
        id: tag
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          TAG="${INPUT_TAG:-$REF_NAME}"
          # Stable: v1.2.3. Prerelease: v1.2.3-rc01 (rc number zero padded).
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          elif [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-rc[0-9]{2}$ ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Tag '$TAG' is not a product version. Expected" \
              "vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-rcNN (see RELEASING.md)."
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # Deliberately the default branch, not the tag. The extractor and the
      # changelog history live on main; historical tags predate both, so
      # checking out v1.4.1 would leave nothing to run. This also matches the
      # trusted-publisher pattern in hastegeo-publish.yml -- the code with
      # contents:write is always the reviewed copy on main. The tag is still
      # used for permalinks and for the Latest comparison below.
      - name: Checkout release tooling from the default branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          # Full history + tags: the Latest badge decision compares this tag
          # against every other product tag.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Extract release notes from CHANGELOG
        id: notes
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          # An rc tag documents the stable version it is a candidate for.
          VERSION="${TAG%-rc*}"
          python .github/scripts/changelog_release_notes.py \
            --version "$VERSION" \
            --ref "$TAG" \
            --output release-notes.md
          TITLE=$(python .github/scripts/changelog_release_notes.py \
            --version "$VERSION" --print-title)
          if [ "$VERSION" != "$TAG" ]; then
            TITLE="$TITLE (release candidate)"
          fi
          echo "title=$TITLE" >> "$GITHUB_OUTPUT"

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          TITLE: ${{ steps.notes.outputs.title }}
          PRERELEASE: ${{ steps.tag.outputs.prerelease }}
        run: |
          # Never claim the badge here; the reconcile step below decides.
          FLAGS=(--latest=false)
          if [ "$PRERELEASE" = "true" ]; then
            FLAGS+=(--prerelease)
          fi
          if gh release view "$TAG" --repo "${{ github.repository }}" \
              >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --repo "${{ github.repository }}" \
              --title "$TITLE" \
              --notes-file release-notes.md \
              "${FLAGS[@]}"
          else
            gh release create "$TAG" \
              --repo "${{ github.repository }}" \
              --title "$TITLE" \
              --notes-file release-notes.md \
              --verify-tag \
              "${FLAGS[@]}"
          fi

      # Decided from the live release list, not a checkout-time snapshot, and
      # applied to whichever release is highest rather than to this one. That
      # makes it idempotent and order-independent: overlapping runs converge on
      # the same answer, and a mis-set badge self-heals on the next release.
      - name: Reconcile the Latest badge
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          STABLE=$(gh release list --repo "$REPO" --limit 200 --json tagName,isPrerelease,isDraft --jq '.[] | select(.isPrerelease == false and .isDraft == false) | .tagName')
          NEWEST=$(echo "$STABLE" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          if [ -z "$NEWEST" ]; then
            echo 'No stable product release yet; leaving the badge alone.'
            exit 0
          fi
          echo "Highest stable release is $NEWEST; giving it the Latest badge."
          gh release edit "$NEWEST" --repo "$REPO" --latest=true
