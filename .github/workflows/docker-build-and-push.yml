name: Build and Push Docker Images

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      image_dir:
        description: 'Image directory to build (training, imageryprep, or all)'
        required: true
        default: 'all'
        type: choice
        options:
        - all
        - training
        - imageryprep
      image_tag:
        description: 'Docker image tag'
        required: true
        default: 'test-manual'
        type: string
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: read
    # Only run on PR events or manual triggers
    if: |
      github.event_name == 'pull_request' || 
      github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build and Push Docker Image
        shell: bash
        env:
          ACR_NAME: ${{ secrets.ACR_NAME }}
          IMAGE_DIR: ${{ github.event.inputs.image_dir || 'all' }}
          IMAGE_TAG: ${{ github.event.inputs.image_tag || format('{0}-rc{1}', vars.TAG_PREFIX, github.event.number) }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          echo "Building with IMAGE_DIR=$IMAGE_DIR and IMAGE_TAG=$IMAGE_TAG"
          bash .github/scripts/build_and_push_images.sh -i "$IMAGE_DIR" -t "$IMAGE_TAG" -a "$ACR_NAME"
