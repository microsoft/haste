name: Test TiTiler function app

on:
  pull_request:
    paths:
      - "api/titilerfuncapi/**"
      - ".github/workflows/titiler-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      # Same dependency set the Function App resolves at deploy time.
      - name: Install dependencies
        run: |
          python -m pip install -r api/titilerfuncapi/requirements.txt httpx
      - name: Run tests
        run: python -m unittest discover -s api/titilerfuncapi/tests -t . -v
