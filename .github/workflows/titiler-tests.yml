name: Test TiTiler function app

on:
  pull_request:
    paths:
      - "api/titilerfuncapi/**"
      - ".github/workflows/titiler-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      # The HASTE GDAL wheels are built and validated by gdal-runtime-build.yml
      # but are not published until the approval-gated release. This route/API
      # test suite uses the public dependencies; runtime-wheel validation stays
      # in the GDAL workflow, which installs its exact build artifacts.
      - name: Install dependencies
        run: |
          python .github/scripts/filter_dependency_requirements.py \
            api/titilerfuncapi/requirements.txt \
            /tmp/titiler-test-requirements.txt
          python -m pip install -r /tmp/titiler-test-requirements.txt httpx
      - name: Run tests
        env:
          PYTHONPATH: api/titilerfuncapi
        run: python -m unittest discover -s api/titilerfuncapi/tests -t . -v
