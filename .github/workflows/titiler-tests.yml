name: Test TiTiler function app

on:
  pull_request:
    paths:
      - "api/titilerfuncapi/**"
      - ".github/workflows/titiler-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      # Same dependency set the Function App resolves at deploy time.
      - name: Install dependencies
        run: |
          python -m pip install -r api/titilerfuncapi/requirements.txt httpx
      - name: Run tests
        run: python -m unittest discover -s api/titilerfuncapi/tests -t . -v
