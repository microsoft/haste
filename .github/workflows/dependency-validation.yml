---
# Validates that the pinned Python dependencies can actually be installed.
#
# This exists because of PR #153, which bumped `gdal` in
# `hastelib/pyproject.toml` to a version no container ships a wheel for, and
# `rasterio` to a release that requires Python >= 3.12 while every image runs
# 3.11. Both landed on main and broke every local and deploy image build.
#
# Nothing caught it. `docker-build-and-push.yml` deliberately skips the image
# build when a pull request also touches `hastelib/**` (so images are not built
# twice alongside `hastegeo-publish.yml`) -- and #153 touched both. Meanwhile
# `hastegeo-build.yml` only builds the wheel and never installs it into an
# image. That combination left dependency changes completely unvalidated.
#
# This workflow deliberately has NO such skip: it resolves dependencies for
# every Python image on any pull request that touches a dependency file. It
# only resolves, never builds an image, so it stays fast.
#
# The cheap, offline half of this guard lives in
# `hastelib/tests/build/test_dependency_pins.py`, which asserts the GDAL wheel
# each image installs matches the `gdal` pin hastegeo declares.
name: Validate dependency pins

on:
  pull_request:
    branches:
      - main
    paths:
      - "api/hastefuncapi/requirements.txt"
      - "api/hastefuncqueues/requirements.txt"
      - "docker/imageryprep/requirements.txt"
      - "api/hastefuncapi/Dockerfile"
      - "api/hastefuncqueues/Dockerfile"
      - "docker/imageryprep/Dockerfile"
      - "hastelib/pyproject.toml"
      - "ui/package.json"
      - "ui/package-lock.json"
      - ".github/workflows/dependency-validation.yml"
  workflow_dispatch:

permissions: {}

jobs:
  resolve:
    name: Resolve ${{ matrix.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      # Report every broken image in one run rather than stopping at the
      # first, so a single fix round can address all of them.
      fail-fast: false
      matrix:
        include:
          - name: hastefuncapi
            requirements: api/hastefuncapi/requirements.txt
            python: "3.11"
            functions_worker: true
          - name: hastefuncqueues
            requirements: api/hastefuncqueues/requirements.txt
            python: "3.11"
            functions_worker: true
          - name: imageryprep
            requirements: docker/imageryprep/requirements.txt
            python: "3.11"
            functions_worker: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}

      - name: Confirm the image Python version matches this job
        run: |
          set -euo pipefail
          dockerfile="$(dirname "${{ matrix.requirements }}")/Dockerfile"
          # Guards against the matrix drifting away from the base image: a
          # resolution proved against 3.11 says nothing about a 3.12 image.
          if ! grep -qE "^FROM .*python${{ matrix.python }}" "$dockerfile"; then
            echo "::error file=$dockerfile::Base image is not Python \
          ${{ matrix.python }}; update the matrix in this workflow." >&2
            grep -E "^FROM " "$dockerfile" >&2
            exit 1
          fi

      - name: Resolve dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          # Run from the requirements file's own directory: the Functions
          # images pull hastegeo in with `-e ../../hastelib`, and pip
          # resolves relative paths against the working directory rather
          # than the file's location.
          cd "$(dirname "${{ matrix.requirements }}")"
          # --dry-run resolves the full graph and reports conflicts without
          # installing, which is all we need and keeps the job quick. Both
          # failure modes from #153 surface here: an unsatisfiable pin pair
          # raises ResolutionImpossible, and a release that requires a newer
          # Python raises "No matching distribution found".
          pip install --dry-run --report /tmp/report.json \
            -r "$(basename "${{ matrix.requirements }}")"

      - name: Check protobuf stays compatible with the Functions worker
        if: matrix.functions_worker
        run: |
          set -euo pipefail
          # The Azure Functions Python worker ships its own protobuf (5.29.x
          # at the time of writing) and its generated pb2 modules cannot load
          # under protobuf 7. When site-packages wins, the worker reports
          # "0 functions found" and every route and queue trigger silently
          # disappears -- with no error anywhere. tensorboard 2.21 requires
          # protobuf >= 6.31.1, which is how that got pulled in.
          python - <<'PY'
          import json
          import sys

          with open("/tmp/report.json", encoding="utf-8") as handle:
              report = json.load(handle)

          for item in report.get("install", []):
              metadata = item.get("metadata", {})
              if metadata.get("name", "").lower() != "protobuf":
                  continue
              version = metadata.get("version", "")
              major = int(version.split(".")[0])
              if major >= 6:
                  sys.exit(
                      f"protobuf {version} would be installed. The Functions "
                      "worker bundles 5.x and breaks silently above it; pin "
                      "protobuf<6 (and keep tensorboard below 2.21)."
                  )
              print(f"protobuf {version} OK")
              break
          else:
              print("protobuf not in the resolved set")
          PY

  npm:
    name: Resolve ui npm dependencies
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - name: Resolve dependencies
        working-directory: ui
        run: |
          set -euo pipefail
          # npm install fails with ERESOLVE when a peer range cannot be
          # satisfied. react was bumped to 19 while react-dom stayed on 18
          # and @azure/msal-react only supports <= 18, so the UI image could
          # not install at all. Nothing built the UI on a dependency change,
          # so it reached main.
          npm install --dry-run

      - name: Check react and react-dom majors agree
        working-directory: ui
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import re
          import sys

          with open("package.json", encoding="utf-8") as handle:
              pkg = json.load(handle)

          def major(spec):
              match = re.search(r"(\d+)", spec or "")
              return match.group(1) if match else None

          pairs = [
              ("react", "react-dom", pkg.get("dependencies", {})),
              ("@types/react", "@types/react-dom", pkg.get("devDependencies", {})),
          ]

          failures = []
          for left, right, section in pairs:
              if left not in section or right not in section:
                  continue
              if major(section[left]) != major(section[right]):
                  failures.append(
                      f"{left} {section[left]} and {right} {section[right]} "
                      "are different majors"
                  )

          if failures:
              sys.exit("; ".join(failures))
          print("react/react-dom majors agree")
          PY
