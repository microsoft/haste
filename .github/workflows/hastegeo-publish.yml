name: Publish hastegeo wheel and images

on:
  workflow_run:
    workflows:
      - Build hastegeo wheel
    types:
      - completed

permissions:
  actions: read
  contents: read

jobs:
  prepare:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.event == 'push' ||
       github.event.workflow_run.event == 'workflow_dispatch' ||
       (github.event.workflow_run.event == 'pull_request' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      wheel_name: ${{ steps.resolve.outputs.wheel_name }}
      channel: ${{ steps.resolve.outputs.channel }}
      source_sha: ${{ steps.resolve.outputs.source_sha }}
      already_published: ${{ steps.resolve.outputs.already_published }}
      pr_number: ${{ steps.guard.outputs.pr_number }}
    steps:
      - name: Checkout trusted release policy
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Verify PR is open and build matches current head
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event.workflow_run.event }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "pr_number=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$PR_NUMBER" ]; then
            echo "::error::Triggering workflow has no PR number"
            exit 1
          fi
          STATE=$(gh pr view "$PR_NUMBER" \
            --repo "${{ github.repository }}" \
            --json state \
            --jq '.state')
          HEAD_SHA=$(gh pr view "$PR_NUMBER" \
            --repo "${{ github.repository }}" \
            --json headRefOid \
            --jq '.headRefOid')
          if [ "$STATE" != "OPEN" ]; then
            echo "::error::PR #$PR_NUMBER is not open"
            exit 1
          fi
          if [ "$HEAD_SHA" != "$SOURCE_SHA" ]; then
            echo "::error::PR head changed after the wheel build"
            exit 1
          fi
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

      # The channel is derived from the triggering event type, which comes from
      # the trusted workflow_run payload. It is deliberately never read from
      # the build's inputs or artifact: those originate on the built ref, and a
      # branch that could name its own channel could publish itself as stable.
      # A dispatch is therefore always 'dev', whatever channel it built with --
      # an rc/release dispatch builds a differently named wheel, so the
      # revalidate step below fails closed rather than publishing it.
      - name: Re-resolve expected version from trusted policy
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          CHANNEL: >-
            ${{ github.event.workflow_run.event == 'pull_request' && 'rc'
            || github.event.workflow_run.event == 'workflow_dispatch' && 'dev'
            || 'release' }}
        run: |
          python .github/scripts/resolve_hastegeo_version.py \
            --channel "$CHANNEL" \
            --source-sha "$SOURCE_SHA"

      # A dev wheel is only ever built because somebody dispatched one, so a
      # skipped publish strands them: the run goes green and the missing wheel
      # surfaces much later as a deploy-apps "release asset does not exist".
      # Fail here instead. RC and stable publication stay silent when halted --
      # both are automatic, so annotating every PR would be noise.
      - name: Fail loudly when dev publication is disabled
        if: >-
          steps.resolve.outputs.channel == 'dev' &&
          steps.resolve.outputs.already_published != 'true' &&
          vars.HASTEGEO_DEV_PUBLISH_ENABLED == 'false'
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          echo "::error::Dev publication is halted by the repository variable" \
               "HASTEGEO_DEV_PUBLISH_ENABLED=false, so ${VERSION} was NOT" \
               "published to haste-binaries and cannot be deployed. The wheel" \
               "is still attached to the build run as an artifact. Unset the" \
               "variable, or set it to anything other than 'false', to resume."
          exit 1

      - name: Download wheel artifact
        if: steps.resolve.outputs.already_published != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          gh run download "$RUN_ID" \
            --repo "${{ github.repository }}" \
            --name "hastegeo-wheel-${RUN_ID}" \
            --dir release-artifact

      # Turns the fail-closed channel mismatch above into a legible error.
      - name: Confirm the artifact matches the resolved channel
        if: steps.resolve.outputs.already_published != 'true'
        env:
          WHEEL_NAME: ${{ steps.resolve.outputs.wheel_name }}
          CHANNEL: ${{ steps.resolve.outputs.channel }}
        run: |
          if [ ! -f "release-artifact/${WHEEL_NAME}" ]; then
            echo "::error::Expected ${WHEEL_NAME} for the ${CHANNEL} channel," \
                 "but the build produced: $(ls -m release-artifact)." \
                 "A dispatched build publishes only on the dev channel;" \
                 "re-run 'Build hastegeo wheel' with channel: dev."
            exit 1
          fi

      - name: Revalidate downloaded wheel
        if: steps.resolve.outputs.already_published != 'true'
        run: |
          python .github/scripts/publish_hastegeo_wheel.py \
            --wheel "release-artifact/${{ steps.resolve.outputs.wheel_name }}" \
            --expected-version "${{ steps.resolve.outputs.version }}" \
            --channel "${{ steps.resolve.outputs.channel }}" \
            --source-sha "${{ steps.resolve.outputs.source_sha }}" \
            --validate-only

  publish-rc:
    needs: prepare
    if: >-
      needs.prepare.outputs.channel == 'rc' &&
      needs.prepare.outputs.already_published != 'true' &&
      vars.HASTEGEO_RC_PUBLISH_ENABLED != 'false'
    runs-on: ubuntu-latest
    concurrency:
      group: hastegeo-rc-publish
      cancel-in-progress: false
    permissions:
      actions: read
      contents: write
    outputs:
      version: ${{ steps.publish.outputs.published_version }}
      source_sha: ${{ needs.prepare.outputs.source_sha }}
      pr_number: ${{ needs.prepare.outputs.pr_number }}
    steps:
      - name: Checkout trusted publisher
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Download wheel artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          gh run download "$RUN_ID" \
            --repo "${{ github.repository }}" \
            --name "hastegeo-wheel-${RUN_ID}" \
            --dir release-artifact

      - name: Publish immutable RC wheel
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python .github/scripts/publish_hastegeo_wheel.py \
            --wheel "release-artifact/${{ needs.prepare.outputs.wheel_name }}" \
            --expected-version "${{ needs.prepare.outputs.version }}" \
            --channel rc \
            --source-sha "${{ needs.prepare.outputs.source_sha }}"

  # Dev wheels exist to iterate on a function app without minting a release
  # candidate: an RC drags in matching locked images it does not need, because
  # deploy-apps requires image tags to equal any *rc* wheel version. A .devN
  # version carries no such coupling, so a dev wheel deploys against whatever
  # images are already there. They are published, immutable, and pruned by
  # rc-cleanup.yml like RCs -- never tagged, and never a release input.
  publish-dev:
    needs: prepare
    if: >-
      needs.prepare.outputs.channel == 'dev' &&
      needs.prepare.outputs.already_published != 'true' &&
      vars.HASTEGEO_DEV_PUBLISH_ENABLED != 'false'
    runs-on: ubuntu-latest
    concurrency:
      group: hastegeo-dev-publish
      cancel-in-progress: false
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout trusted publisher
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Download wheel artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          gh run download "$RUN_ID" \
            --repo "${{ github.repository }}" \
            --name "hastegeo-wheel-${RUN_ID}" \
            --dir release-artifact

      - name: Publish immutable dev wheel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python .github/scripts/publish_hastegeo_wheel.py \
            --wheel "release-artifact/${{ needs.prepare.outputs.wheel_name }}" \
            --expected-version "${{ needs.prepare.outputs.version }}" \
            --channel dev \
            --source-sha "${{ needs.prepare.outputs.source_sha }}"

      - name: Summarise how to deploy it
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ### Dev wheel published

          \`hastegeo ${VERSION}\` from \`${BRANCH}\`.

          Deploy it with **Deploy Azure Applications**:

          - \`hastegeo_version\`: \`${VERSION}\`
          - \`component\`: \`funcqueue\` (or \`funcapi\`)
          - \`training_image_tag\` / \`imageprep_image_tag\`: **required** --
            no images are built for a dev wheel, so pass the tags this
            environment already runs (see \`AZURE_BATCH_DOCKER_IMAGE\` on the
            queue app). The deploy refuses to run without them.

          Dev wheels are pruned by **Report or prune prerelease wheels**; add the
          filename to \`.github/rc-retain.txt\` to pin one an environment is
          still running.
          EOF

  # Stable publication is automatic on merge to the default branch: the PR
  # review required to land the commit there is the release approval. A second
  # per-release sign-off would re-approve an already-reviewed commit.
  # HASTEGEO_PUBLISH_ENABLED remains the kill switch.
  #
  # HASTEGEO_RELEASE_APPROVAL_CONFIGURED is deliberately NOT read here. It still
  # gates the destructive RC deletion job in rc-cleanup.yml, which keeps the
  # protected hastegeo-release environment.
  publish-stable:
    needs: prepare
    if: >-
      needs.prepare.outputs.channel == 'release' &&
      needs.prepare.outputs.already_published != 'true' &&
      vars.HASTEGEO_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout trusted publisher
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Download wheel artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          gh run download "$RUN_ID" \
            --repo "${{ github.repository }}" \
            --name "hastegeo-wheel-${RUN_ID}" \
            --dir release-artifact

      - name: Publish immutable stable wheel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python .github/scripts/publish_hastegeo_wheel.py \
            --wheel "release-artifact/${{ needs.prepare.outputs.wheel_name }}" \
            --expected-version "${{ needs.prepare.outputs.version }}" \
            --channel release \
            --source-sha "${{ needs.prepare.outputs.source_sha }}"

  build-rc-images:
    needs:
      - prepare
      - publish-rc
    if: >-
      needs.publish-rc.result == 'success' &&
      vars.HASTEGEO_RC_ENVIRONMENT != ''
    runs-on: ubuntu-latest
    environment: ${{ vars.HASTEGEO_RC_ENVIRONMENT }}
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        include:
          - image_dir: training
            image_name: hastetraining
          - image_dir: imageryprep
            image_name: hasteimageryprep
    steps:
      - name: Checkout RC source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          persist-credentials: false

      - name: Stamp RC version into image source
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("hastelib/src/hastegeo/__about__.py")
          text = path.read_text(encoding="utf-8")
          text, count = re.subn(
              r'^__version__ = ".*"$',
              f'__version__ = "{os.environ["VERSION"]}"',
              text,
              flags=re.MULTILINE,
          )
          if count != 1:
              raise SystemExit("Expected exactly one __version__ assignment")
          path.write_text(text, encoding="utf-8")
          PY

      - name: Azure login
        uses: azure/login@1384c340ab2dda50fed2bee3041d1d87018aa5e8 # v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build, push, and lock matching RC image
        env:
          ACR_NAME: ${{ secrets.ACR_NAME }}
          IMAGE_DIR: ${{ matrix.image_dir }}
          IMAGE_NAME: ${{ matrix.image_name }}
          VERSION: ${{ needs.prepare.outputs.version }}
          SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          IMAGE_REF="${IMAGE_NAME}:${VERSION}"
          if IMAGE_JSON=$(az acr repository show \
              --name "$ACR_NAME" \
              --image "$IMAGE_REF" \
              --output json 2>/dev/null); then
            WRITE_ENABLED=$(echo "$IMAGE_JSON" | \
              jq -r '.changeableAttributes.writeEnabled')
            if [ "$WRITE_ENABLED" = "false" ]; then
              echo "Reusing already locked RC image: $IMAGE_REF"
              exit 0
            fi
            echo "::error::Existing RC image is not locked: $IMAGE_REF"
            exit 1
          fi
          az acr build \
            --subscription "$SUBSCRIPTION_ID" \
            --registry "$ACR_NAME" \
            --image "$IMAGE_REF" \
            --file "docker/${IMAGE_DIR}/Dockerfile" \
            .
          az acr repository update \
            --name "$ACR_NAME" \
            --image "$IMAGE_REF" \
            --write-enabled false \
            --delete-enabled false

  rc-artifact-summary:
    needs:
      - prepare
      - publish-rc
      - build-rc-images
    if: needs.build-rc-images.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Publish matching RC deployment values
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.prepare.outputs.pr_number }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          BODY=$(cat <<EOF
          ### RC artifacts ready

          All branch deployment references use the same RC tag:

          - \`hastegeo_version\`: \`${VERSION}\`
          - \`training_image_tag\`: \`${VERSION}\`
          - \`imageprep_image_tag\`: \`${VERSION}\`
          - wheel: \`hastegeo-${VERSION}-py3-none-any.whl\`
          EOF
          )
          echo "$BODY" >> "$GITHUB_STEP_SUMMARY"
          gh pr comment "$PR_NUMBER" \
            --repo "${{ github.repository }}" \
            --body "$BODY"
