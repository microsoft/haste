experiment_name: "maui_demo_0"
experiment_dir: "/app/training/experiments/maui_demo_0"
imagery:
  raw_fn: "/app/training/raw/maxar_lahaina_8_12_2023-visual.tif"
  rgb_fn: "/app/training/raw/maxar_lahaina_8_12_2023-visual.tif"  # Optional, path to an RGB version of the raw imagery
  num_channels: 3  # REQUIRED -- Number of channels in the raw imagery (3 for RGB)
  normalization_means:  # REQUIRED -- Normalization values to use for each channel.
    - 0  # The imagery will be normalized as (x_c - mean_c) / std_c for each channel c.
    - 0  # The values here should be in the same order as the channels in the raw imagery.
    - 0  # E.g. if you have 8-bit imagery and you want to do [0,1] normalization, you can set means to 0 and stds to 255.
  normalization_stds:
    - 255
    - 255
    - 255

labels:
  fn: "/app/training/labels/Maui_Wildfires_August_0.geojson" # Path to the label file that is generated by the satellite-imagery-labeling-tool
  classes:  # The unique values in the `class` column of the labels file.
    - Background  # Class value 1
    - Building  # Class value 2
    - Damaged Building  # Class value 3
  buffer_in_meters: 3  # Buffer this many meters around each `class_to_buffer` polygon with the `class_to_buffer_by` class value
  class_to_buffer: Building
  class_to_buffer_by: Background
  # Optional: tile the labels onto a grid of this cell size (in the units of the
  # imagery CRS) and emit one image/mask pair per populated cell. Useful when the
  # labeled buildings are sparse and spread across a large scene. Omit or set to
  # null to crop a single image/mask pair covering the whole label extent.
  cluster_size_in_meters: null
  min_pixels_per_cluster: 1000  # Clusters with fewer labeled pixels than this are discarded

training:
  learning_rate: 0.0001
  max_epochs: 10
  batch_size: 32
  gpu_id: 1
  gpu_ids: null  # Optional: list of GPU ids for multi-GPU (DDP) training, e.g. [0, 1]. Overrides gpu_id.
  log_dir: logs/
  checkpoint_subdir: checkpoints/ # Where the weights will be saved during training, relative to experiment_dir
  use_constraint_loss: false  # Weakly-supervised "No Damage" loss; requires "No Damage" and "Damaged Building" in labels.classes
  initial_weights_fn: null  # Path to a checkpoint file to initialize model weights from, or null to use ImageNet weights.

inference:
  output_subdir: "outputs/"
  checkpoint_fn: "checkpoints/last.ckpt"  # should mirror training.checkpoint_subdir
  batch_size: 2
  gpu_id: 1
  patch_size: 2048
  padding: 64
