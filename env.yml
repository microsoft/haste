# This environment is used for local development and testing of the HASTE project.
name: haste_env
channels:
  - conda-forge
  - osgeo
dependencies:
  - gdal=3.9.2
  - python=3.11  # don't use the very latest version of python in case wheels aren't made for everything
  - pip
  - xarray
  - pip:
    - azure-functions
    - pydantic==2.9.2
    - pyyaml==6.0.2
    - azure-cosmos==4.7.0
    - azure-storage-blob==12.23.0
    - azure-storage-file-datalake==12.17.0
    - azure-storage-queue==12.12.0
    - azure-batch==14.2.0
    - azure-mgmt-containerregistry==10.3.0
    - azure-mgmt-web
    - azure-core==1.38.0
    - azure-identity==1.18.0
    - psycopg2-binary==2.9.9
    - requests==2.32.4
    - requests-auth==8.0.0
    - rasterio==1.3.11
    - opencv-python==4.10.0.84
    - shapely==2.0.6
    - boto3==1.36.20
    - tensorboard==2.19.0
    - hatch
    - pre-commit
    - black
    - isort
    - flake8
    - sphinx>=7.1.0
    - sphinx-rtd-theme>=1.3.0
    - sphinx-autodoc-typehints>=1.24.0
    - typing-extensions>=4.8.0
    - -e hastelib/
